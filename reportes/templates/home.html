{% extends 'base.html' %}
{% load static %}

{% block title %}ECVA - Inicio{% endblock %}

{% block content %}
<div class="w-full max-w-7xl mx-auto mt-8 px-4">
    <h1 class="text-2xl font-semibold tracking-tight text-black/90">
        Bienvenido, <span class="text-brand font-bold">{{ user.username }}</span>
    </h1>
    <p class="text-sm text-black/50 mb-6">¿Qué deseas hacer el día de hoy?</p>

    <div class="p-6 rounded-lg border border-black/10 bg-white shadow-md">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Crear reporte -->
            <form method="get" action="{% url 'crear_reporte' %}">
                <button type="submit" class="w-full p-4 rounded-lg border border-black/10 hover:bg-gray-50 hover:border-brand transition-all text-left flex items-center gap-4">
                    <div class="bg-brand p-3 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold text-black">Crear Reporte</h3>
                        <p class="text-sm text-black/50">Registrar nuevo daño</p>
                    </div>
                </button>
            </form>

            <!-- Ver reportes -->
            <form method="get" action="{% url 'tabla_reportes' %}">
                <button type="submit" class="w-full p-4 rounded-lg border border-black/10 hover:bg-gray-50 hover:border-brand transition-all text-left flex items-center gap-4">
                    <div class="bg-gray-100 p-3 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold text-black">Ver Reportes</h3>
                        <p class="text-sm text-black/50">Lista de reportes</p>
                    </div>
                </button>
            </form>

            <!-- Ver clientes -->
            <form method="get" action="{% url 'tabla_clientes' %}">
                <button type="submit" class="w-full p-4 rounded-lg border border-black/10 hover:bg-gray-50 hover:border-brand transition-all text-left flex items-center gap-4">
                    <div class="bg-gray-100 p-3 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold text-black">Clientes</h3>
                        <p class="text-sm text-black/50">Gestionar clientes</p>
                    </div>
                </button>
            </form>

            <!-- Ver empleados -->
            <form method="get" action="{% url 'tabla_empleados' %}">
                <button type="submit" class="w-full p-4 rounded-lg border border-black/10 hover:bg-gray-50 hover:border-brand transition-all text-left flex items-center gap-4">
                    <div class="bg-gray-100 p-3 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold text-black">Empleados</h3>
                        <p class="text-sm text-black/50">Gestionar empleados</p>
                    </div>
                </button>
            </form>

            <!-- Registrar cliente -->
            <form method="get" action="{% url 'registrar_cliente' %}">
                <button type="submit" class="w-full p-4 rounded-lg border border-black/10 hover:bg-gray-50 hover:border-brand transition-all text-left flex items-center gap-4">
                    <div class="bg-gray-100 p-3 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold text-black">Nuevo Cliente</h3>
                        <p class="text-sm text-black/50">Registrar cliente</p>
                    </div>
                </button>
            </form>

            <!-- Cerrar sesión -->
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="w-full p-4 rounded-lg border border-black/10 hover:bg-red-50 hover:border-red-500 transition-all text-left flex items-center gap-4">
                    <div class="bg-brand/10 p-3 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold text-black">Cerrar Sesión</h3>
                        <p class="text-sm text-black/50">Salir del sistema</p>
                    </div>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
