{% extends 'base.html' %}
{% load static %}

{% block title %}ECVA - Reportes{% endblock %}

{% block content %}
<div class="w-full max-w-7xl mx-auto mt-8 px-4">
    <h1 class="text-2xl font-semibold tracking-tight mb-6 text-black/90">
        Historial de Reportes
    </h1>

    <div class="p-6 rounded-lg border border-black/10 bg-white shadow-md">
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="buscador" placeholder="Buscar ID, remito o cliente ..." class="form-control md:w-[500px]">
            <select id="filtroEmpleado" class="form-control md:w-48">
                <option value="">Todos los empleados</option>
                {% for emp in empleados %}
                    <option value="{{ emp.id }}">{{ emp.nombre|title }} {{ emp.apellido|title }}</option>
                {% endfor %}
            </select>
            <input type="date" id="fechaDesde" class="form-control md:w-40" placeholder="Desde">
            <input type="date" id="fechaHasta" class="form-control md:w-40" placeholder="Hasta">
            <button id="btnLimpiar" class="inline-flex items-center justify-center rounded-md border border-black px-4 py-2 text-sm font-medium text-black hover:bg-brand hover:border-brand hover:text-white transition-colors">
                Limpiar
            </button>
        </div>

        <div class="overflow-x-auto -mx-4 sm:mx-0">
            <table class="w-full text-sm text-left border-collapse">
                <thead class="bg-black/5 text-black/70 uppercase text-xs">
                    <tr>
                        <th class="px-3 py-3 border-b border-black/10 font-bold sort-btn cursor-pointer hover:bg-black/10" data-sort="id">
                            N° <span id="sort-id" class="ml-1">↓</span>
                        </th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold sort-btn cursor-pointer hover:bg-black/10" data-sort="remito_recepcion">
                            Remito <span id="sort-remito_recepcion" class="ml-1">⇅</span>
                        </th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold">
                            Fecha
                        </th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold sort-btn cursor-pointer hover:bg-black/10" data-sort="cliente__nombre">
                            Cliente <span id="sort-cliente__nombre" class="ml-1">⇅</span>
                        </th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold sort-btn cursor-pointer hover:bg-black/10" data-sort="empleado__nombre">
                            Empleado <span id="sort-empleado__nombre" class="ml-1">⇅</span>
                        </th>
                    </tr>
                </thead>
                <tbody id="tablaBody" class="divide-y divide-black/5">
                    {% include 'partials/filas_reportes.html' %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/tabla_reportes.js' %}"></script>
{% endblock %}
