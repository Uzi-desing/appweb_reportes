{% extends 'base.html' %}
{% load static %}

{% block title %}ECVA - Clientes{% endblock %}

{% block content %}
<div class="w-full max-w-7xl mx-auto mt-8 px-4">
    <h1 class="text-2xl font-semibold tracking-tight mb-6 text-black/90">
        Directorio de Clientes
    </h1>

    <div class="p-6 rounded-lg border border-black/10 bg-white shadow-md">
        <div class="flex flex-col md:flex-row md:items-center gap-4 mb-6">
            <input type="text" id="buscador" placeholder="Buscar por Razón Social ..." class="form-control w-full md:w-64">
            <button id="btnLimpiar" class="inline-flex items-center justify-center rounded-md border border-black px-4 py-2 text-sm font-medium text-black hover:bg-brand hover:border-brand hover:text-white transition-colors whitespace-nowrap">
                Limpiar
            </button>
            <a href="{% url 'registrar_cliente' %}" class="inline-flex items-center justify-center rounded-md border border-black px-6 py-2 text-sm font-medium text-black hover:bg-brand hover:border-brand hover:text-white transition-colors whitespace-nowrap">
                Añadir Cliente
            </a>
        </div>

        <div class="overflow-x-auto -mx-4 sm:mx-0">
            <table class="w-full text-sm text-left border-collapse min-w-[600px]">
                <thead class="bg-black/5 text-black/70 uppercase text-xs">
                    <tr>
                        <th class="px-3 py-3 border-b border-black/10 font-bold sort-btn cursor-pointer hover:bg-black/10" data-sort="nombre">
                            Razón Social <span id="sort-nombre" class="ml-1">⇅</span>
                        </th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold">Teléfono</th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold">Email</th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold">Domicilio</th>
                    </tr>
                </thead>
                <tbody id="tablaBody" class="divide-y divide-black/5">
                    {% include 'partials/filas_clientes.html' %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/tabla_clientes.js' %}"></script>
{% endblock %}
