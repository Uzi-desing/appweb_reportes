{% extends 'base.html' %}
{% load static %}

{% block title %}ECVA - Empleados{% endblock %}

{% block content %}
<div class="w-full max-w-7xl mx-auto mt-8 px-4">
    <h1 class="text-2xl font-semibold tracking-tight mb-6 text-black/90">
        Directorio de Empleados
    </h1>

    <div class="p-6 rounded-lg border border-black/10 bg-white shadow-md">
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="buscador" placeholder="Buscar por Nombre, Apellido o DNI ..." class="form-control md:w-64">
            <select id="filtroRol" class="form-control md:w-48">
                <option value="">Todos los puestos</option>
                {% for rol in roles %}
                    <option value="{{ rol.id }}">{{ rol.puesto }}</option>
                {% endfor %}
            </select>
            <button id="btnLimpiar" class="inline-flex items-center justify-center rounded-md border border-black px-4 py-2 text-sm font-medium text-black hover:bg-brand hover:border-brand hover:text-white transition-colors">
                Limpiar
            </button>
        </div>

        <div class="overflow-x-auto -mx-4 sm:mx-0">
            <table class="w-full text-sm text-left border-collapse min-w-[700px]">
                <thead class="bg-black/5 text-black/70 uppercase text-xs">
                    <tr>
                        <th class="px-3 py-3 border-b border-black/10 font-bold sort-btn cursor-pointer hover:bg-black/10" data-sort="nombre">
                            Empleado <span id="sort-nombre" class="ml-1">↑</span>
                        </th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold sort-btn cursor-pointer hover:bg-black/10" data-sort="dni">
                            DNI <span id="sort-dni" class="ml-1">⇅</span>
                        </th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold">Puesto</th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold">Teléfono</th>
                        <th class="px-3 py-3 border-b border-black/10 font-bold">Email</th>
                    </tr>
                </thead>
                <tbody id="tablaBody" class="divide-y divide-black/5">
                    {% include 'partials/filas_empleados.html' %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/tabla_empleados.js' %}"></script>
{% endblock %}
